site_name: AI4Devs (Holberton School)
site_url: https://evisp.github.io/ai4devs/
site_author: Holberton School
site_description: AI for Developers curriculum materials, tutorials, and project guides.

repo_name: evisp/ai4devs
repo_url: https://github.com/evisp/ai4devs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - typeset
  - minify:
      minify_html: true

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - toc:
      permalink: true

  # Enables :material-...: and :octicons-...: shortcodes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/evisp

copyright: >
  Copyright © 2026 Holberton School

